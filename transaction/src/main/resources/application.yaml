spring:
  profiles:
    active: dev,local
  application:
    name: transaction
  task:
    scheduling:
      enabled: true

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      service: transaction-guard
      env: dev